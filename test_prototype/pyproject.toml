[project]
name = "fam-test-prototype"
version = "0.1.0"
description = "Prototyp testowy: analiza symetrii i proporcji twarzy 2D (zdjęcie) i 3D (RGB-D, Intel RealSense D455)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.1.1",   # przynosi opencv-contrib-python; nie dodawać opencv-python
    "numpy",
    "scipy",
    "pandas",
    "matplotlib",
    "pillow",
    "pillow-heif",        # zdjęcia HEIC z iPhone'a
    "pyyaml",
    "jinja2",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
